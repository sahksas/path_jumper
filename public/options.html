<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Path Jumper</title>
    <style>
      :root {
        color-scheme: light dark;
      }
      body {
        font:
          14px/1.5 system-ui,
          -apple-system,
          "Segoe UI",
          Roboto,
          sans-serif;
        max-width: 480px;
        margin: 32px auto;
        padding: 0 20px;
      }
      h1 {
        font-size: 18px;
        margin: 0 0 20px;
      }
      .row {
        display: flex;
        align-items: flex-start;
        gap: 10px;
        padding: 12px 0;
        border-top: 1px solid rgba(127, 127, 127, 0.2);
      }
      .row:first-of-type {
        border-top: none;
      }
      label {
        cursor: pointer;
      }
      .desc {
        margin: 4px 0 0 26px;
        font-size: 12px;
        opacity: 0.7;
      }
      #status {
        margin-top: 16px;
        font-size: 12px;
        opacity: 0;
        transition: opacity 0.3s;
        color: #2a8;
      }
      #status.visible {
        opacity: 1;
      }
    </style>
  </head>
  <body>
    <h1 data-i18n="optionsTitle">Path Jumper</h1>
    <div class="row">
      <input type="checkbox" id="showToast" />
      <div>
        <label for="showToast" data-i18n="optionShowToast">Show toast on jump</label>
        <div class="desc" data-i18n="optionShowToastDesc">
          Briefly show the destination path in the top-right corner after navigating.
        </div>
      </div>
    </div>
    <div id="status" data-i18n="settingsSaved">Saved</div>
    <script src="js/options.js"></script>
  </body>
</html>
